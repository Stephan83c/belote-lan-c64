# Client PC pour Windows : belote-lan.exe (PyInstaller), joint à chaque release publiée.
# Aussi lançable à la main (onglet Actions, « Run workflow ») : l'exe est alors un artefact.
name: Client Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install pyinstaller pytest
      - name: Tests du client sous Windows
        working-directory: server
        run: python -m pytest -q tests/test_client_pc.py
      - name: belote-lan.exe
        run: pyinstaller --onefile --console --name belote-lan pc/belote_lan.py
      - name: L'exe démarre
        run: dist/belote-lan.exe --help > aide.txt; Get-Content aide.txt
      - uses: actions/upload-artifact@v5
        with:
          name: belote-lan-windows
          path: dist/belote-lan.exe
      - name: Joindre à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/belote-lan.exe --clobber
